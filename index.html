<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demande de rideaux sur mesure</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#141412;--mute:#62625B;--line:#d5dce2;--acc:#FD9813;--accink:#141412;--err:#E91548;--acct:#FD9813;--ok:#1e8e3e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181e;--card:#1a232b;--ink:#e8edf1;--mute:#9aa7b3;--line:#2d3944;--acc:#FD9813;--accink:#141412;--err:#E91548;--ok:#5fcf80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12181e;--card:#1a232b;--ink:#e8edf1;--mute:#9aa7b3;--line:#2d3944;--acc:#FD9813;--accink:#141412;--err:#E91548;--ok:#5fcf80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,Tahoma,sans-serif;line-height:1.6}
main{max-width:520px;margin:0 auto;padding:24px 18px 48px}
h1{font-size:1.3rem;line-height:1.3;margin:0 0 6px;text-align:center}
.sub{color:var(--mute);margin:0 0 18px}
.bar{display:flex;gap:6px;margin:0 0 6px}
.bar i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.bar i.on{background:var(--acc)}
.step-t{color:var(--acct);font-size:.9rem;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.step{display:none}.step.on{display:block}
h2{font-size:1.15rem;margin:0 0 6px}
label{display:block;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=tel],input[type=number],input[type=email],textarea{width:100%;font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px}
textarea{min-height:100px;resize:vertical}
::placeholder{color:var(--mute);opacity:1}
input[type=tel],input[type=number]{direction:ltr;text-align:right}
html[dir=ltr] input[type=tel],html[dir=ltr] input[type=number]{text-align:left}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rt{border-top:1px solid var(--line);margin-top:12px;padding-top:4px}
.choices{display:grid;gap:10px;margin-top:8px}
.opt{position:relative;display:block;margin:0;font-weight:600}
.opt input{position:absolute;opacity:0}
.opt span{display:block;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);cursor:pointer}
.opt input:checked+span{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.opt input:focus-visible+span{outline:3px solid var(--acc);outline-offset:2px}
.lang{display:grid;gap:12px;margin-top:10px}
.lang button{padding:18px;font-size:1.25rem}
.stp{display:flex;align-items:center;justify-content:center;gap:18px;margin:10px 0;direction:ltr}
.stp button{flex:0 0 52px;padding:8px;font-size:1.4rem}
.stp output{font-size:1.8rem;font-weight:700;min-width:2ch;text-align:center}
.swatches{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:8px}
.sw{display:block;margin:0;font-weight:600;position:relative}
.sw input{position:absolute;opacity:0}
.sw .box{display:block;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:var(--bg)}
.sw .pic{display:flex;align-items:center;justify-content:center;height:90px;color:var(--acct)}
.sw .pic svg{height:100%;width:100%}
.sw .name{display:block;padding:8px 10px;font-size:.95rem}
.sw .name small{display:block;font-weight:400;color:var(--mute);font-size:.82rem}
.sw input:checked+.box{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.sw input:focus-visible+.box{outline:3px solid var(--acc);outline-offset:2px}
.diagram{display:block;width:100%;max-width:280px;margin:8px auto 4px;color:var(--acct);direction:ltr}
.diagram text{fill:var(--ink);font:600 13px Cairo,system-ui,sans-serif}
.note{border-inline-start:4px solid var(--acc);background:var(--bg);padding:12px 14px;border-radius:8px;margin-top:12px}
.total{text-align:center;margin:14px 0 4px}.total b{display:inline-flex;align-items:baseline;gap:6px;padding:6px 20px;border:1.5px solid #1B7A56;border-radius:999px;color:#1B7A56;font-weight:700;letter-spacing:.3px}.pn{font-size:1.9rem;line-height:1.2;font-variant-numeric:tabular-nums}.pc{font-size:.95rem}.inc{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px;justify-content:start;font-size:.85rem}.inc li{display:flex;align-items:flex-start;gap:8px}.inc li::before{content:"✓";flex:none;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;margin-top:3px;border-radius:50%;background:var(--ok);color:#fff;font-size:10px}
.hd{display:flex;direction:rtl;align-items:center;justify-content:center;gap:14px;margin:0 0 10px}.word{height:auto;width:min(260px,calc(100% - 76px))}.logo{width:60px;height:60px;border-radius:50%;flex:none}.me{width:104px;height:auto;border-radius:12px;border:2px solid var(--acct);flex:none}.ci{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}.or{color:#1B7A56}.wc{color:#FCB503}.gr{color:#1B7A56;font-weight:700}.sl{display:block;width:min(280px,80%);height:auto;margin:10px auto}html[lang=ar] .sl-fr,html[lang=fr] .sl-ar{display:none}.contact{display:flex;flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;margin-top:10px;font-size:.95rem;direction:ltr;margin-top:18px}.inc .pmli{margin-top:10px;font-size:1.05rem;color:#1B7A56;border:2px solid #1B7A56;border-radius:8px;padding:6px 14px;justify-content:center}.inc .pmli::before{display:none}.contact a,.contact .ig{display:inline-flex;align-items:center;gap:6px;color:var(--acct);text-decoration:none}.contact svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2}.hh,.ww{direction:ltr;text-align:right}html[dir=ltr] .hh,html[dir=ltr] .ww{text-align:left}.incl{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;margin-top:10px}.incl svg{width:22px;height:22px;flex:none}.conf{color:var(--acct);font-size:.8rem;text-align:center;margin:6px 0 0}.chk span{display:flex;align-items:center;gap:10px}.chk span::before{content:"";flex:none;width:18px;height:18px;border:2px solid var(--line);border-radius:4px;text-align:center;line-height:14px;color:#fff;font-size:12px}.chk span{padding:6px 2px;font-size:.95rem;border:0;background:transparent}.opt.chk input:checked+span{border:0;box-shadow:none}.chk input:checked+span::before{content:"✓";background:var(--ok);border-color:var(--ok)}#sl{grid-template-columns:repeat(3,1fr);gap:6px}#sl .pic{height:76px}#sl .name{padding:6px 4px;font-size:.8rem}#sl .name small{font-size:.7rem}.rv{margin:14px 0 4px}.fin2 .stars{display:block;width:150px;height:28px;margin:0 auto}.fin2 .rvb{display:inline-block;margin-top:6px;padding:6px 10px;color:#9A7009;font-weight:700;font-size:1.15rem;text-decoration:none}.rvc{margin:16px 0 6px}#fx{position:fixed;inset:0;z-index:99999;pointer-events:none;display:none}#fx.on{display:block}
.fxbg{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(255,244,214,.55),rgba(28,16,8,.55));opacity:0;transition:opacity .35s ease}#fx.on .fxbg{opacity:1}#fx.off .fxbg{opacity:0;transition:opacity .7s ease}
#fxc{position:absolute;inset:0;width:100%;height:100%}
#fxl{position:absolute;left:50%;top:50%;width:min(48vw,220px);height:min(48vw,220px);border-radius:50%;object-fit:cover;transform:translate(-50%,-50%) scale(0);opacity:0;box-shadow:0 24px 70px rgba(0,0,0,.38),0 0 0 5px rgba(253,152,19,.85),0 0 60px 10px rgba(253,152,19,.35)}
@keyframes fxIn{0%{transform:translate(-50%,-50%) scale(.15) rotate(-14deg);opacity:0}60%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}100%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}}
@keyframes fxOut{0%{transform:translate(-50%,-50%) scale(1);opacity:1}28%{transform:translate(-50%,-50%) scale(1.3);opacity:1}100%{transform:translate(-50%,-50%) scale(.1);opacity:0}}
.hide{display:none}
.gm{margin:22px 0 4px;padding-top:16px;border-top:1px solid var(--line);text-align:center}
.gm label{margin-top:0}
.gmr{display:flex;gap:8px;align-items:stretch}
.gmr input{flex:1;min-width:0}
.gmr button{flex:none;width:auto;padding:10px 18px}
.gok{color:#1B7A56;font-weight:700;margin:10px 0 0}
.gbad{color:#E91548;margin:10px 0 0}
.hint{display:block;color:var(--mute);font-size:.85rem;margin-top:5px}
#em{direction:ltr;text-align:left}
.inc.ico li::before{display:none}
.inc .ic{flex:none;display:inline-flex;width:20px;height:20px;margin-top:1px;color:#FD9813}
.inc .ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nx{background:#B8860B}
.fin2 .contact a{color:var(--ink)}
.ptl{text-align:center;font-weight:700;font-size:1.05rem;color:#1B7A56;margin-top:14px}
.fin2 .contact svg{stroke:#FD9813}
.sum .pmv{margin-top:16px}
.sum{margin:18px 0 6px;padding:18px 16px;border:1.5px solid #1B7A56;border-radius:16px;text-align:start;background:rgba(27,122,86,.06)}
.sum .sumt{text-align:center;font-weight:700;font-size:1.05rem;color:#1B7A56;letter-spacing:.2px}
.sum .total{margin:10px 0 6px}
.sum .sums{text-align:center;font-weight:600;margin:8px 0 10px}
.sum .inc{font-size:.92rem;margin-top:10px}
.sum .sumbox{margin-top:14px;padding:12px 14px;border-radius:10px;border-inline-start:4px solid #1B7A56;background:rgba(27,122,86,.09);line-height:1.55}
.sum .sumbox p{margin:0 0 6px}
.sum .sumbox p:last-child{margin:0}
.sum .fee{font-weight:700}.gap{margin-top:22px;padding-top:18px;border-top:1.5px solid #BDBDBD}
.err{color:var(--err);font-size:.92rem;min-height:1.4em;margin:10px 0 0}
.nav{display:flex;gap:10px;margin-top:6px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:13px;cursor:pointer;flex:1;background:var(--acc);color:var(--accink)}
button.back{flex:0 0 auto;padding:13px 20px;background:transparent;color:var(--ink);border:1px solid var(--line)}
.small{color:var(--mute);font-size:.88rem;text-align:center;margin-top:12px}
.fin2 h2{color:var(--ok)}.fin2 .contact svg{width:17px;height:17px;flex:none}.err a{color:inherit}.fin2{text-align:center}.fin2 svg{width:76px;height:76px}.fin2 a{color:var(--acct)}
.nolang .sub,.nolang .bar,.nolang .step-t,.nolang .err,.nolang .nav,.nolang .small,.fin .sub,.fin .bar,.fin .step-t,.fin .err,.fin .nav,.fin .small{display:none}
</style>

    c.clearRect(0,0,W,H);
    if(!fired&&t>=BURST){fired=true;make(64,380,1000,0);make(34,160,520,.12);lg.style.animation="fxOut .5s ease-in forwards";}
    if(fired){
      var bt=(t-BURST)/1000,R=Math.max(W,H)*.62;
      if(bt<.9){var e=1-Math.pow(1-bt/.9,3);c.save();c.globalAlpha=(1-bt/.9)*.7;c.lineWidth=7*(1-bt/.9)+1;c.strokeStyle="#FD9813";c.beginPath();c.arc(cx,cy,60+e*R,0,6.2832);c.stroke();c.restore();}

      if(bt<.45){var g=c.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*.5);g.addColorStop(0,"rgba(255,226,150,"+(.65*(1-bt/.45))+")");g.addColorStop(1,"rgba(255,226,150,0)");c.fillStyle=g;c.fillRect(0,0,W,H);}
      var n=0;
      P.forEach(function(p){p.age+=dt;if(p.age<0){n++;return;}
        var drag=Math.exp(-1.35*dt);p.vx*=drag;p.vy=p.vy*drag+820*k*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;

      if(!n&&bt>1.5)alive=false;
    }
    if(alive)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

}
